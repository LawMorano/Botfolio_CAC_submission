{% extends "base.html" %}
{% block title %}{{ resource['name'] }} preview &mdash; Botfolio{% endblock %}
{% block content %}
<div class="resource-preview-head"><div><p class="eyebrow">Subsystem preview</p><h1>{{ resource['name'] }}</h1><p class="sub">From {{ resource['design_title'] }}</p></div><a class="btn btn--quiet" href="{{ url_for('design_detail', design_id=resource['design_id']) }}#subsystems">Back to robot</a></div>
<div class="resource-viewer" id="resource-viewer"><p class="viewer-status" id="preview-status">Loading 3D preview…</p></div>
<script type="module">
import * as THREE from "{{ url_for('static', filename='vendor/three/three.module.js') }}";
import { OrbitControls } from "{{ url_for('static', filename='vendor/three/addons/controls/OrbitControls.js') }}";
import { GLTFLoader } from "{{ url_for('static', filename='vendor/three/addons/loaders/GLTFLoader.js') }}";
import { STLLoader } from "{{ url_for('static', filename='vendor/three/addons/loaders/STLLoader.js') }}";
import { OBJLoader } from "{{ url_for('static', filename='vendor/three/addons/loaders/OBJLoader.js') }}";
const host=document.getElementById('resource-viewer'), status=document.getElementById('preview-status');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d131b);
const camera=new THREE.PerspectiveCamera(45,2,.01,10000); camera.position.set(3,2,3);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x243040,2.5)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(4,8,6); scene.add(sun);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
const url={{ url_for('resource_model', resource_id=resource['id'])|tojson }}, ext={{ resource['filename'].rsplit('.',1)[-1].lower()|tojson }};
function frame(object){scene.add(object); const box=new THREE.Box3().setFromObject(object), center=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3()).length()||1; controls.target.copy(center); camera.position.copy(center).add(new THREE.Vector3(size*.8,size*.55,size*.8)); camera.near=size/1000; camera.far=size*100; camera.updateProjectionMatrix(); status.remove();}
function fail(){status.textContent='This preview could not be loaded. You can still download the file.'}
if(ext==='glb') new GLTFLoader().load(url,g=>frame(g.scene),undefined,fail); else if(ext==='stl') new STLLoader().load(url,g=>{const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xff7540,roughness:.65})); frame(m)},undefined,fail); else new OBJLoader().load(url,frame,undefined,fail);
function resize(){const w=host.clientWidth,h=Math.max(520,innerHeight-260); renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix()} addEventListener('resize',resize); resize(); (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script>
{% endblock %}
