{% extends "auth_base.html" %}
{% block title %}Choose a new password &mdash; Botfolio{% endblock %}

{% block auth_heading %}Choose a new password{% endblock %}

{% block auth_form %}
  <form method="post" class="stack">
    <label>
      New password
      <input name="password" type="password" required minlength="8" autocomplete="new-password" autofocus>
      <small>At least 8 characters.</small>
    </label>
    <label>
      Confirm new password
      <input name="confirmation" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <button class="btn btn--primary btn--lg" type="submit">Change password</button>
  </form>
{% endblock %}
