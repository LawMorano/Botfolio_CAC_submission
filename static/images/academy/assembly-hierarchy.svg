<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Simple assembly hierarchy</title><desc id="desc">A wheel-module assembly contains fixed structure, a reusable wheel subassembly, retention hardware, and an optional motor reference.</desc><rect width="900" height="440" rx="24" fill="#f5f7fb"/><g stroke="#94a3b8" stroke-width="4" fill="none"><path d="M450 100v55H180v55M450 155H400v55M450 155H650v55M450 155H790v55"/><path d="M400 275v45H315v35M400 320h85v35"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153"><g stroke="#183153" stroke-width="3"><rect x="315" y="35" width="270" height="70" rx="14" fill="#dbeafe"/><rect x="65" y="205" width="230" height="70" rx="14" fill="#dcfce7"/><rect x="310" y="205" width="180" height="70" rx="14" fill="#e0e7ff"/><rect x="535" y="205" width="230" height="70" rx="14" fill="#fef3c7"/><rect x="690" y="305" width="180" height="70" rx="14" fill="#fff"/><rect x="230" y="350" width="170" height="60" rx="14" fill="#fff"/><rect x="420" y="350" width="150" height="60" rx="14" fill="#fff"/></g><text x="450" y="78" font-size="23" font-weight="700">Wheel-module assembly</text><text x="180" y="245" font-size="20" font-weight="700">Fixed structure</text><text x="400" y="245" font-size="20" font-weight="700">Wheel subassembly</text><text x="650" y="245" font-size="20" font-weight="700">Retention hardware</text><text x="780" y="345" font-size="18">Optional motor reference</text><text x="315" y="387" font-size="18">Wheel + hub</text><text x="495" y="387" font-size="18">Shaft / axle</text></g></svg>
