<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-labelledby="title desc"><title id="title">Loose bodies versus organized parts or components</title><desc id="desc">Anonymous loose solids on the left are contrasted with named reusable geometry grouped by responsibility on the right.</desc><rect width="820" height="390" rx="24" fill="#f5f7fb"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="205" y="45" font-size="24" font-weight="700" fill="#991b1b">Loose solids</text><text x="615" y="45" font-size="24" font-weight="700" fill="#166534">Organized ownership</text></g>
  <g fill="#fee2e2" stroke="#b91c1c" stroke-width="4"><circle cx="130" cy="150" r="55"/><rect x="230" y="100" width="100" height="100" rx="12"/><rect x="125" y="245" width="200" height="45" rx="10"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#991b1b" text-anchor="middle"><text x="130" y="155">Body 1</text><text x="280" y="155">Body 2</text><text x="225" y="273">Body 3</text></g>
  <g fill="#dcfce7" stroke="#16784b" stroke-width="4"><rect x="455" y="85" width="320" height="78" rx="14"/><rect x="455" y="185" width="320" height="78" rx="14"/><rect x="455" y="285" width="320" height="60" rx="14"/></g><g font-family="Arial,sans-serif" fill="#183153" text-anchor="middle"><text x="615" y="118" font-size="20" font-weight="700">Wheel reference</text><text x="615" y="143" font-size="16">source • axis • VERIFIED</text><text x="615" y="218" font-size="20" font-weight="700">Bearing reference</text><text x="615" y="243" font-size="16">source • seats • MEASURE</text><text x="615" y="322" font-size="20" font-weight="700">Custom interface • team-owned</text></g>
</svg>
