<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img" aria-labelledby="title desc"><title id="title">Interference versus service-access clearance</title><desc id="desc">A blocked wheel collides with structure and traps a fastener, while a reviewed wheel has measured clearance, tool access, and a removal path.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16784b"/></marker></defs><rect width="860" height="410" rx="24" fill="#f5f7fb"/><path d="M430 45v320" stroke="#cbd5e1" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="24" font-weight="700"><text x="215" y="45" fill="#991b1b">Blocked</text><text x="645" y="45" fill="#166534">Serviceable</text></g><g stroke="#183153" stroke-width="5"><rect x="70" y="105" width="85" height="210" fill="#dbeafe"/><circle cx="255" cy="210" r="108" fill="#fee2e2"/><rect x="505" y="105" width="65" height="210" fill="#dbeafe"/><circle cx="700" cy="210" r="92" fill="#dcfce7"/></g><path d="M135 175l55 55m0-55l-55 55" stroke="#b91c1c" stroke-width="10"/><path d="M595 210h-5" stroke="#e87836" stroke-width="6"/><path d="M700 85V55" stroke="#16784b" stroke-width="7" marker-end="url(#a)"/><path d="M610 330h165" stroke="#16784b" stroke-width="6" marker-end="url(#a)"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18"><text x="215" y="365" fill="#991b1b">collision + trapped tool path</text><text x="645" y="365" fill="#166534">measured gap + removal direction</text><text x="582" y="195" fill="#9a3412">clearance</text></g></svg>
