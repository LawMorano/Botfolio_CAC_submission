<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="title desc"><title id="title">Origin and axis consistency</title><desc id="desc">Five wheel-module references share a horizontal axis and use origins on comparable mounting faces.</desc><rect width="880" height="400" rx="24" fill="#f5f7fb"/><path d="M55 200h770" stroke="#e87836" stroke-width="5" stroke-dasharray="12 8"/>
  <g stroke="#183153" stroke-width="4"><rect x="90" y="130" width="70" height="140" fill="#dbeafe"/><circle cx="265" cy="200" r="65" fill="#dcfce7"/><rect x="360" y="180" width="150" height="40" rx="18" fill="#fef3c7"/><rect x="555" y="145" width="55" height="110" fill="#dbeafe"/><rect x="670" y="115" width="120" height="170" rx="16" fill="#e0e7ff"/></g>
  <g fill="#183153"><circle cx="90" cy="200" r="7"/><circle cx="200" cy="200" r="7"/><circle cx="360" cy="200" r="7"/><circle cx="555" cy="200" r="7"/><circle cx="670" cy="200" r="7"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153"><text x="125" y="310">plate</text><text x="265" y="310">bearing</text><text x="435" y="260">shaft / spacer</text><text x="582" y="310">mount face</text><text x="730" y="310">motor envelope</text><text x="440" y="365" font-size="20" font-weight="700">origins sit on functional faces; axes point the same direction</text></g>
</svg>
