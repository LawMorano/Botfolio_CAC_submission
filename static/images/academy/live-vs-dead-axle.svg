<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="title desc"><title id="title">Live-axle versus dead-axle architecture</title><desc id="desc">In a live axle the wheel and shaft rotate together; in a dead axle the shaft stays fixed while the wheel rotates around it.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87836"/></marker></defs><rect width="860" height="420" rx="24" fill="#f5f7fb"/><path d="M430 40v330" stroke="#cbd5e1" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="700" fill="#183153"><text x="215" y="50">Live axle</text><text x="645" y="50">Dead axle</text></g><g stroke="#183153" stroke-width="5"><rect x="60" y="125" width="55" height="170" fill="#dbeafe"/><rect x="315" y="125" width="55" height="170" fill="#dbeafe"/><rect x="105" y="188" width="220" height="44" rx="20" fill="#fef3c7"/><circle cx="215" cy="210" r="88" fill="#dcfce7"/><circle cx="215" cy="210" r="25" fill="#fef3c7"/><rect x="490" y="125" width="55" height="170" fill="#dbeafe"/><rect x="745" y="125" width="55" height="170" fill="#dbeafe"/><rect x="535" y="188" width="220" height="44" rx="20" fill="#e0e7ff"/><circle cx="645" cy="210" r="88" fill="#dcfce7"/><circle cx="645" cy="210" r="28" fill="#fff"/></g><path d="M140 112a112 112 0 1 1-15 178" fill="none" stroke="#e87836" stroke-width="6" marker-end="url(#a)"/><path d="M570 112a112 112 0 1 1-15 178" fill="none" stroke="#e87836" stroke-width="6" marker-end="url(#a)"/><g stroke="#991b1b" stroke-width="5"><path d="M570 335l28 28m0-28l-28 28M692 335l28 28m0-28l-28 28"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18"><text x="215" y="385" fill="#166534">wheel + shaft rotate together</text><text x="645" y="385" fill="#991b1b">shaft fixed; wheel rotates around it</text></g></svg>
