<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Fixed versus revolute relationships</title><desc id="desc">A fixed relationship removes all relative motion while a revolute relationship preserves rotation about one axis.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87836"/></marker></defs><rect width="800" height="390" rx="24" fill="#f5f7fb"/><path d="M400 45v300" stroke="#cbd5e1" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="25"><text x="200" y="50" fill="#991b1b">Fixed</text><text x="600" y="50" fill="#166534">Revolute</text></g><g stroke="#183153" stroke-width="5"><rect x="95" y="105" width="210" height="165" rx="14" fill="#dbeafe"/><circle cx="200" cy="188" r="42" fill="#fff"/><circle cx="600" cy="188" r="92" fill="#dcfce7"/><circle cx="600" cy="188" r="30" fill="#fff"/></g><g stroke="#991b1b" stroke-width="6"><path d="M135 300l30 30m0-30l-30 30M235 300l30 30m0-30l-30 30"/></g><path d="M515 105a115 115 0 1 1-16 160" fill="none" stroke="#e87836" stroke-width="7" marker-end="url(#a)"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18" fill="#183153"><text x="200" y="365">no relative movement</text><text x="600" y="365">rotation remains around one axis</text></g></svg>
