<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Critical wheel-module hardware interfaces</title><desc id="desc">A sectioned wheel module identifies the common axis, mounting faces, bearing seats, shaft diameter, hole locations, and collision envelope.</desc><rect width="900" height="420" rx="24" fill="#f5f7fb"/>
  <rect x="105" y="90" width="690" height="240" rx="120" fill="none" stroke="#e87836" stroke-width="4" stroke-dasharray="12 9"/><path d="M60 210h780" stroke="#183153" stroke-width="4" stroke-dasharray="10 8"/>
  <g stroke="#183153" stroke-width="5"><rect x="180" y="135" width="55" height="150" fill="#dbeafe"/><circle cx="300" cy="210" r="62" fill="#dcfce7"/><rect x="270" y="185" width="360" height="50" rx="24" fill="#fef3c7"/><circle cx="685" cy="210" r="88" fill="#dbeafe"/><circle cx="685" cy="210" r="28" fill="#fff"/></g>
  <g stroke="#e87836" stroke-width="3" fill="none"><path d="M205 135V65h-70"/><path d="M300 148V65"/><path d="M450 185v-80"/><path d="M685 122V65h95"/><path d="M685 298v65h95"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#183153"><text x="30" y="60">mounting face</text><text x="250" y="55">bearing seat</text><text x="390" y="95">shaft diameter + axis</text><text x="700" y="55">wheel width</text><text x="700" y="390">hole / hub interface</text><text x="350" y="355">dashed boundary = collision envelope</text></g>
</svg>
