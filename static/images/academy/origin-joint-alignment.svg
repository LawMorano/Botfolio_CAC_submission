<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="title desc"><title id="title">Connector or joint-origin axis alignment</title><desc id="desc">A correct example aligns centers, axes, and directions; an incorrect example has offset centers and a reversed axis.</desc><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#16784b"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="860" height="390" rx="24" fill="#f5f7fb"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="24" font-weight="700"><text x="220" y="45" fill="#166534">Aligned</text><text x="640" y="45" fill="#991b1b">Misaligned</text></g><g stroke="#183153" stroke-width="5" fill="#dbeafe"><rect x="75" y="115" width="95" height="180" rx="12"/><circle cx="305" cy="205" r="85"/><rect x="495" y="115" width="95" height="180" rx="12"/><circle cx="725" cy="245" r="85"/></g><g fill="#183153"><circle cx="170" cy="205" r="8"/><circle cx="305" cy="205" r="8"/><circle cx="590" cy="205" r="8"/><circle cx="725" cy="245" r="8"/></g><path d="M105 205h280" stroke="#16784b" stroke-width="6" marker-end="url(#b)"/><path d="M520 205h160" stroke="#b91c1c" stroke-width="6" marker-end="url(#r)"/><path d="M795 245H650" stroke="#b91c1c" stroke-width="6" marker-end="url(#r)"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18"><text x="220" y="350" fill="#166534">same center, axis, and direction</text><text x="640" y="350" fill="#991b1b">offset centers and reversed direction</text></g></svg>
