<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Safe versus weak hole placement near an edge</title>
  <desc id="desc">A green example leaves substantial material from the hole edge to the plate edge; a red example leaves a thin weak bridge.</desc>
  <rect width="760" height="360" rx="24" fill="#f5f7fb"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="24"><text x="190" y="48" fill="#166534">Checked material</text><text x="570" y="48" fill="#991b1b">Weak placement</text></g>
  <g><rect x="65" y="90" width="250" height="190" rx="10" fill="#dcfce7" stroke="#16784b" stroke-width="5"/><circle cx="190" cy="185" r="42" fill="#fff" stroke="#16784b" stroke-width="6"/><path d="M190 185H310" stroke="#e87836" stroke-width="4"/><path d="M233 170v30M300 170v30" stroke="#e87836" stroke-width="4"/><text x="268" y="225" font-family="Arial,sans-serif" font-size="18" fill="#183153">edge material</text></g>
  <g><rect x="445" y="90" width="250" height="190" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="5"/><circle cx="640" cy="185" r="42" fill="#fff" stroke="#b91c1c" stroke-width="6"/><path d="M682 185h13" stroke="#e87836" stroke-width="4"/><text x="570" y="320" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#991b1b">hole radius consumes the apparent margin</text></g>
</svg>
