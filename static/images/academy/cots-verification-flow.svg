<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">COTS source-verification flow</title><desc id="desc">A sequence from exact product identity through source, units, dimensions, confidence, and physical checks to an approved reference.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87836"/></marker></defs><rect width="980" height="360" rx="24" fill="#f5f7fb"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153" font-weight="700" font-size="18"><g fill="#dbeafe" stroke="#183153" stroke-width="3"><rect x="25" y="120" width="135" height="90" rx="14"/><rect x="185" y="120" width="135" height="90" rx="14"/><rect x="345" y="120" width="135" height="90" rx="14"/><rect x="505" y="120" width="135" height="90" rx="14"/><rect x="665" y="120" width="135" height="90" rx="14"/></g><rect x="825" y="120" width="130" height="90" rx="14" fill="#dcfce7" stroke="#16784b" stroke-width="3"/><text x="92" y="155"><tspan x="92">Manufacturer</tspan><tspan x="92" dy="24">+ part no.</tspan></text><text x="252" y="155"><tspan x="252">Source</tspan><tspan x="252" dy="24">+ date</tspan></text><text x="412" y="155"><tspan x="412">Units + critical</tspan><tspan x="412" dy="24">dimensions</tspan></text><text x="572" y="155"><tspan x="572">Confidence</tspan><tspan x="572" dy="24">level</tspan></text><text x="732" y="155"><tspan x="732">Physical</tspan><tspan x="732" dy="24">checks</tspan></text><text x="890" y="155"><tspan x="890">Approved</tspan><tspan x="890" dy="24">reference</tspan></text></g>
  <g stroke="#e87836" stroke-width="5" marker-end="url(#a)"><path d="M160 165h20M320 165h20M480 165h20M640 165h20M800 165h20"/></g><text x="490" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#183153">A visual match alone never completes this flow.</text>
</svg>
