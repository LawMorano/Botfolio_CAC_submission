<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="title desc"><title id="title">Verified dimensions versus design clearances</title><desc id="desc">Verified hardware dimensions and separate learner-selected clearance, wall, and edge values combine in an expression to control a custom interface.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87836"/></marker></defs><rect width="880" height="410" rx="24" fill="#f5f7fb"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153"><rect x="40" y="55" width="250" height="120" rx="16" fill="#dbeafe" stroke="#183153" stroke-width="3"/><text x="165" y="88" font-size="21" font-weight="700">Verified hardware</text><text x="165" y="120" font-size="17">bearing OD • shaft diameter</text><text x="165" y="148" font-size="17">mounting pattern • units</text><rect x="40" y="235" width="250" height="120" rx="16" fill="#fef3c7" stroke="#183153" stroke-width="3"/><text x="165" y="268" font-size="21" font-weight="700">Design choices</text><text x="165" y="300" font-size="17">clearance • wall thickness</text><text x="165" y="328" font-size="17">edge material • tolerance</text><rect x="365" y="145" width="190" height="120" rx="16" fill="#fff" stroke="#e87836" stroke-width="4"/><text x="460" y="192" font-size="21" font-weight="700">Expression</text><text x="460" y="225" font-size="17">verified size</text><text x="460" y="248" font-size="17">+ chosen allowance</text><rect x="635" y="145" width="205" height="120" rx="16" fill="#dcfce7" stroke="#16784b" stroke-width="4"/><text x="738" y="192" font-size="21" font-weight="700">Custom interface</text><text x="738" y="225" font-size="17">traceable fit</text><text x="738" y="248" font-size="17">manufacturable material</text></g>
  <g stroke="#e87836" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M290 115c45 0 45 70 70 76"/><path d="M290 295c45 0 45-70 70-76"/><path d="M555 205h75"/></g>
</svg>
